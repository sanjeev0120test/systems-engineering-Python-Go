[project]
name = "systems-engineering-python-go"
version = "0.1.0"
description = "Local systems engineering practice lab — Python-first, Go basics"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["python"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
